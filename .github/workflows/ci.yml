name: CI

on:
  push:
    branches: [main]
  pull_request:

# Single workflow, no duplicated config (plan R33): checks -> integration and
# checks -> compose-smoke both build on the same lint/typecheck/unit gate.
# compose-smoke is "compose-smoke + e2e": existing curl gates remain fast-fail
# preludes (R44), then the Playwright suite runs against the same stack boot.
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit

  integration:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Testcontainers pulls its own postgres:16 / redis:7 images (pinned
      # inside the integration tests themselves, matching this workflow's
      # pinning — plan Testing Strategy T4); GitHub-hosted runners ship
      # Docker, so no extra service containers are declared here.
      - run: pnpm test:integration

  compose-smoke:
    needs: [checks, integration]
    runs-on: ubuntu-latest
    env:
      # Single literal site in this job (SEC-E1): the curl login step below
      # and the Playwright e2e step both consume these same two values.
      E2E_DEMO_EMAIL: admin@demo.example
      E2E_DEMO_PASSWORD: demo-admin-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build and start the stack
        run: docker compose up -d --build

      - name: Wait for API health endpoint
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 120))
          until curl -sf -o /dev/null http://localhost:3001/healthz; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "api /healthz did not return 200 within 120s" >&2
              docker compose logs api || true
              exit 1
            fi
            sleep 2
          done

      - name: Wait for seed job to complete
        # `docker compose wait` blocks until the service's container stops
        # and exits with that container's own exit code — the gate here is
        # judged by this step's own exit status (R44), not by grepping logs.
        timeout-minutes: 2
        run: docker compose wait seed

      - name: Log in as the seeded demo admin
        run: |
          set -euo pipefail
          http_status="$(curl -sS -o /tmp/login-response.json -w '%{http_code}' \
            -c /tmp/cookies.txt \
            -H 'Content-Type: application/json' \
            -H 'Origin: http://localhost:3000' \
            -d "{\"tenantSlug\":\"demo\",\"email\":\"${E2E_DEMO_EMAIL}\",\"password\":\"${E2E_DEMO_PASSWORD}\"}" \
            http://localhost:3001/api/auth/login)"
          echo "login http status: $http_status"
          cat /tmp/login-response.json
          if [ "$http_status" != "200" ]; then
            echo "login did not return 200" >&2
            exit 1
          fi

      - name: Assert seeded demo shows >=1 orphan account
        run: |
          set -euo pipefail
          http_status="$(curl -sS -o /tmp/orphan-response.json -w '%{http_code}' \
            -b /tmp/cookies.txt \
            'http://localhost:3001/api/accounts?status=orphan')"
          echo "orphan http status: $http_status"
          cat /tmp/orphan-response.json
          if [ "$http_status" != "200" ]; then
            echo "GET /api/accounts?status=orphan did not return 200" >&2
            exit 1
          fi
          count="$(jq '.items | length' /tmp/orphan-response.json)"
          echo "orphan count: $count"
          if [ "$count" -lt 1 ]; then
            echo "expected >=1 orphan account, got $count" >&2
            exit 1
          fi

      - name: Assert seeded demo shows >=1 ghost account
        run: |
          set -euo pipefail
          http_status="$(curl -sS -o /tmp/ghost-response.json -w '%{http_code}' \
            -b /tmp/cookies.txt \
            'http://localhost:3001/api/accounts?status=ghost')"
          echo "ghost http status: $http_status"
          cat /tmp/ghost-response.json
          if [ "$http_status" != "200" ]; then
            echo "GET /api/accounts?status=ghost did not return 200" >&2
            exit 1
          fi
          count="$(jq '.items | length' /tmp/ghost-response.json)"
          echo "ghost count: $count"
          if [ "$count" -lt 1 ]; then
            echo "expected >=1 ghost account, got $count" >&2
            exit 1
          fi

      - name: Install Playwright chromium browser
        # --filter e2e, not a bare `pnpm exec`: @playwright/test is declared in
        # e2e/package.json only, so the root has no `playwright` binary to run.
        # This step had never actually executed — the repository carried no git
        # remote for three cycles, so CI never ran and the error stayed hidden.
        run: pnpm --filter e2e exec playwright install --with-deps chromium

      - name: Run the e2e suite
        run: pnpm test:e2e

      - name: Assert seed acceptance bar survived the e2e suite
        run: bash e2e/scripts/assert-seed-preserved.sh

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down the stack
        if: always()
        run: docker compose down -v

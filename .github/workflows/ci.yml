name: CI

on:
  push:
    branches: [main]
  pull_request:

# Single workflow, no duplicated config (plan R33): checks -> integration and
# checks -> compose-smoke both build on the same lint/typecheck/unit gate.
# compose-smoke is "compose-smoke + e2e": existing curl gates remain fast-fail
# preludes (R44), then the Playwright suite runs against the same stack boot.

# Nothing here writes to the repository or the package registry: the jobs lint,
# typecheck, run tests and upload a failure-only artifact. Declaring the floor
# explicitly matters because every job runs `pnpm install --frozen-lockfile`
# with install scripts permitted for argon2/esbuild/sharp/protobufjs/
# msgpackr-extract, and actions/checkout otherwise leaves a repo-scoped token in
# .git/config where any of those scripts could read it.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job pushes; leaving the token in .git/config only exposes it
          # to the install scripts pnpm-workspace.yaml permits.
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit

      - name: Every assigned test file is inside a typecheck program
        # `pnpm typecheck` is `tsc --noEmit` per member, and each member's
        # tsconfig `include` decides what that sees. Narrowing one is silent:
        # measured, `apps/api` with `include: ["src"]` exits 0 with a planted
        # TS2322 in test/ gone. Total wipeout is loud (TS18003); the partial
        # narrowing is not — the SC58 asymmetry, on the only type gate CI runs.
        #
        # Asked of the resolver, not of the glob's spelling: an earlier attempt
        # pattern-matched `include` strings and redded on apps/web, whose
        # `**/*.ts` covers test/ correctly. `--listFilesOnly` costs 33s wall
        # here and does not fit the unit suite's CPU budget, which is why it
        # lives in CI (SC66).
        run: |
          set -euo pipefail
          pnpm -r --parallel exec tsc --noEmit --listFilesOnly > /tmp/tsc-program.txt
          pnpm -w exec vitest list --filesOnly --project unit > /tmp/assigned.txt
          pnpm -w exec vitest list --filesOnly --project integration >> /tmp/assigned.txt
          missing=0
          while read -r f; do
            [ -n "$f" ] || continue
            f=${f#\[*\] }
            if ! grep -qF "$f" /tmp/tsc-program.txt; then
              echo "assigned test file outside every typecheck program: $f" >&2
              missing=1
            fi
          done < /tmp/assigned.txt
          exit "$missing"

  integration:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job pushes; leaving the token in .git/config only exposes it
          # to the install scripts pnpm-workspace.yaml permits.
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Testcontainers pulls its own postgres:16 / redis:7 images (pinned
      # inside the integration tests themselves, matching this workflow's
      # pinning — plan Testing Strategy T4); GitHub-hosted runners ship
      # Docker, so no extra service containers are declared here.
      - run: pnpm test:integration

  compose-smoke:
    needs: [checks, integration]
    runs-on: ubuntu-latest
    env:
      # Single literal site in this job (SEC-E1): the curl login step below
      # and the Playwright e2e step both consume these same two values.
      E2E_DEMO_EMAIL: admin@demo.example
      E2E_DEMO_PASSWORD: demo-admin-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job pushes; leaving the token in .git/config only exposes it
          # to the install scripts pnpm-workspace.yaml permits.
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build and start the stack
        run: docker compose up -d --build

      - name: Every built image carries every workspace manifest
        # The builder adjudicating what it actually produced. `pnpm install
        # --frozen-lockfile` is SILENT when a lockfile importer has no manifest on
        # disk, so an omitted COPY installs none of that member's dependencies and
        # the image builds green — the defect this cycle found with api-types and
        # e2e missing.
        #
        # The parity gate checks that from the Dockerfile's TEXT, and text is what
        # kept failing: five install spellings walked past an anchored matcher, and
        # a `target:` with a trailing comment dropped a whole service out of the
        # ancestry check. This step asks the images instead, so no spelling of a
        # Dockerfile or a compose file can talk it out of the answer. The member
        # list is derived from `pnpm list -r`, never typed.
        run: |
          set -euo pipefail
          members=$(pnpm list -r --depth -1 --json | jq -r --arg root "$PWD" '.[] | select(.path != $root) | .path | sub("^" + $root + "/"; "")')
          [ -n "$members" ] || { echo "no workspace members derived" >&2; exit 1; }
          images=$(docker compose config --format json | jq -r '.services | to_entries[] | select(.value.build) | .value.image // ("open-smp-" + .key)' | sort -u)
          [ -n "$images" ] || { echo "no built images found in the compose config" >&2; exit 1; }
          fail=0
          for image in $images; do
            for dir in $members; do
              if ! docker run --rm --entrypoint sh "$image" -c "test -f /repo/$dir/package.json"; then
                echo "$image is missing /repo/$dir/package.json" >&2
                fail=1
              fi
            done
            if docker run --rm --entrypoint sh "$image" -c \
              'find /repo -maxdepth 5 -type l ! -exec test -e {} \; -print' | grep -q .; then
              echo "$image contains a dangling workspace symlink" >&2
              fail=1
            fi
          done
          exit "$fail"

      - name: Wait for API health endpoint
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 120))
          until curl -sf -o /dev/null http://localhost:3001/healthz; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "api /healthz did not return 200 within 120s" >&2
              docker compose logs api || true
              exit 1
            fi
            sleep 2
          done

      - name: Wait for seed job to complete
        # NOT `docker compose wait`: measured, it reports `no containers for
        # project` and exits 1 once the container has already stopped. That step
        # passed for two cycles only because it happened to run while the seed was
        # still in flight; inserting a 20-second step above it was enough to make
        # it fail on a run where the seed had succeeded. A gate whose verdict
        # depends on how fast the preceding step is, is not a gate.
        #
        # The state and the exit code are read directly, so a seed that has
        # already finished is a pass and a seed that failed is a fail, in either
        # order. Judged by this step's own exit status (R44), not by grepping logs.
        timeout-minutes: 3
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 150))
          while :; do
            state=$(docker compose ps -a --format json seed | jq -r '.State')
            code=$(docker compose ps -a --format json seed | jq -r '.ExitCode')
            case "$state" in
              exited)
                [ "$code" = "0" ] || { echo "seed exited with $code" >&2; docker compose logs seed || true; exit 1; }
                echo "seed completed, exit 0"
                break
                ;;
              running|created|restarting) ;;
              *) echo "seed is in unexpected state '$state'" >&2; docker compose logs seed || true; exit 1 ;;
            esac
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "seed did not finish within 150s (last state: $state)" >&2
              docker compose logs seed || true
              exit 1
            fi
            sleep 2
          done

      - name: Log in as the seeded demo admin
        run: |
          set -euo pipefail
          http_status="$(curl -sS -o /tmp/login-response.json -w '%{http_code}' \
            -c /tmp/cookies.txt \
            -H 'Content-Type: application/json' \
            -H 'Origin: http://localhost:3000' \
            -d "{\"tenantSlug\":\"demo\",\"email\":\"${E2E_DEMO_EMAIL}\",\"password\":\"${E2E_DEMO_PASSWORD}\"}" \
            http://localhost:3001/api/auth/login)"
          echo "login http status: $http_status"
          cat /tmp/login-response.json
          if [ "$http_status" != "200" ]; then
            echo "login did not return 200" >&2
            exit 1
          fi

      - name: Assert seeded demo shows >=1 orphan account
        run: |
          set -euo pipefail
          http_status="$(curl -sS -o /tmp/orphan-response.json -w '%{http_code}' \
            -b /tmp/cookies.txt \
            'http://localhost:3001/api/accounts?status=orphan')"
          echo "orphan http status: $http_status"
          cat /tmp/orphan-response.json
          if [ "$http_status" != "200" ]; then
            echo "GET /api/accounts?status=orphan did not return 200" >&2
            exit 1
          fi
          count="$(jq '.items | length' /tmp/orphan-response.json)"
          echo "orphan count: $count"
          if [ "$count" -lt 1 ]; then
            echo "expected >=1 orphan account, got $count" >&2
            exit 1
          fi

      - name: Assert seeded demo shows >=1 ghost account
        run: |
          set -euo pipefail
          http_status="$(curl -sS -o /tmp/ghost-response.json -w '%{http_code}' \
            -b /tmp/cookies.txt \
            'http://localhost:3001/api/accounts?status=ghost')"
          echo "ghost http status: $http_status"
          cat /tmp/ghost-response.json
          if [ "$http_status" != "200" ]; then
            echo "GET /api/accounts?status=ghost did not return 200" >&2
            exit 1
          fi
          count="$(jq '.items | length' /tmp/ghost-response.json)"
          echo "ghost count: $count"
          if [ "$count" -lt 1 ]; then
            echo "expected >=1 ghost account, got $count" >&2
            exit 1
          fi

      - name: Install Playwright chromium browser
        # -C e2e, not a bare `pnpm exec`: @playwright/test is declared in
        # e2e/package.json only, so the root has no `playwright` binary to run.
        # -C rather than --filter: `--filter <no-match>` used to exit 0 printing
        # "No projects matched the filters", so renaming the package would
        # silently install nothing. `failIfNoMatch: true` in pnpm-workspace.yaml
        # now makes that exit 1, but `-C` is still the right form — it resolves a
        # directory and fails loudly (ENOENT) without depending on a setting any
        # invocation can switch off with `--no-fail-if-no-match`, and it also
        # covers the half no setting reaches: `--filter <real-pkg> test` with no
        # `test` script still exits 0 (SC63). Same reason root `test:e2e` uses
        # `-C e2e test`.
        # This comment has carried a false claim about CI history twice: first
        # "the repository carried no git remote for three cycles, so CI never
        # ran", then "what has never run in CI is the parity gate, because it
        # lives on an unpushed branch" — written in the commit before the branch
        # was pushed. Both were load-bearing for deferring VE5/VE6.
        #
        # A comment is the wrong place for a fact that decays on the next push.
        # What is durably true: this step and the suite it installs for run in
        # `compose-smoke` on every pull request, and the run's own record is the
        # authority — `gh run view <id> --job <id>` reports which steps executed.
        run: pnpm -C e2e exec playwright install --with-deps chromium

      - name: Run the e2e suite
        run: pnpm test:e2e

      - name: The e2e suite actually executed its whole discovered set
        # `pnpm test:e2e` exits 0 when nothing ran. Two measured routes: a
        # `process.exit(0)` in globalSetup (which `--list` never executes, so the
        # parity gate cannot see it), and a runtime `test.skip(() => true)` at
        # describe scope (which emits no annotation). Both leave every in-repo
        # gate green.
        #
        # The listing says what was discovered; the run's own report says what
        # executed. Comparing them is the only thing that separates the two, and
        # it has to happen out of band because no assertion inside the unit suite
        # can observe a run.
        run: |
          set -euo pipefail
          discovered=$(pnpm -s -C e2e test --list --reporter=json | jq '[.. | objects | select(has("specs")) | .specs[]] | length')
          [ "$discovered" -gt 0 ] || { echo "the listing discovered no specs" >&2; exit 1; }
          report=e2e/test-results/report.json
          [ -f "$report" ] || { echo "no e2e run report at $report — the suite did not execute" >&2; exit 1; }
          executed=$(jq '.stats.expected + .stats.unexpected + .stats.flaky + .stats.skipped' "$report")
          echo "discovered=$discovered executed=$executed"
          [ "$executed" = "$discovered" ] || { echo "the e2e suite executed $executed of $discovered discovered specs" >&2; exit 1; }
          skipped=$(jq '.stats.skipped' "$report")
          [ "$skipped" = "0" ] || { echo "$skipped e2e specs were skipped at runtime" >&2; exit 1; }

      - name: Assert seed acceptance bar survived the e2e suite
        run: bash e2e/scripts/assert-seed-preserved.sh

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down the stack
        if: always()
        run: docker compose down -v

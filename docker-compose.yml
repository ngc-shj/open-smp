# Local/demo stack (NFR1): `docker compose up` boots Postgres, Redis, API,
# worker, web, and a one-shot seed job. All credentials below are dev/demo
# only (marked inline) — never used in a production deployment (NFR4).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: opensmp
      POSTGRES_PASSWORD: opensmp # dev/demo only, never production
      POSTGRES_DB: opensmp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opensmp -d opensmp"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    # NFR4: Redis must never be reachable unauthenticated, including in
    # docker-compose. requirepass below is a dev/demo-only credential.
    command: ["redis-server", "--requirepass", "opensmp-redis"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a opensmp-redis ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      target: api
    environment:
      # opensmp_app is the RLS-constrained app role (packages/schema/migrations/0001_init.sql).
      DATABASE_URL: postgres://opensmp_app:opensmp@postgres:5432/opensmp
      # Privileged role, used only for runMigrations at boot (DDL/role creation).
      ADMIN_DATABASE_URL: postgres://opensmp:opensmp@postgres:5432/opensmp
      REDIS_URL: redis://:opensmp-redis@redis:6379
      APP_ORIGIN: http://localhost:3000
      # NFR4. This used to be a fixed literal, so that every clone booted with
      # the same key and any deployment inheriting this file had every tenant's
      # credentials decryptable from a public repository. `:?` makes the stack
      # refuse to start rather than fall back to anything committed — api, worker
      # and seed must all resolve the SAME key, so a per-service default would be
      # worse than none. `scripts/setup-env.sh` writes the gitignored `.env` that
      # compose reads this from.
      ENCRYPTION_KEYS: ${ENCRYPTION_KEYS:?run ./scripts/setup-env.sh first (writes .env with a generated key)}
      PORT: "3001"
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # node:22 (non-slim) doesn't guarantee curl/wget; Node itself always
      # exists in this image, so use it directly instead of assuming a tool.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  worker:
    build:
      context: .
      target: worker
    environment:
      DATABASE_URL: postgres://opensmp_app:opensmp@postgres:5432/opensmp
      REDIS_URL: redis://:opensmp-redis@redis:6379
      # Same value as the api service resolves — see the note there.
      ENCRYPTION_KEYS: ${ENCRYPTION_KEYS:?run ./scripts/setup-env.sh first (writes .env with a generated key)}
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: .
      target: web
      args:
        API_URL: http://api:3001
    environment:
      API_URL: http://api:3001
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  # One-shot idempotent demo seed (C8 acceptance: >=1 orphan AND >=1 ghost
  # in the seeded accounts list). Runs automatically on `docker compose up`
  # (not profile-gated) so NFR1's "with seed data" holds without an extra
  # operator step; safe to re-run (ON CONFLICT DO NOTHING / upsert).
  seed:
    build:
      context: .
      target: api
    environment:
      DATABASE_URL: postgres://opensmp_app:opensmp@postgres:5432/opensmp
      # Same value as the api service resolves — see the note there.
      ENCRYPTION_KEYS: ${ENCRYPTION_KEYS:?run ./scripts/setup-env.sh first (writes .env with a generated key)}
    # WORKDIR is already apps/api (api target), so this runs the local
    # tsx binary directly rather than re-resolving a workspace filter.
    command: ["pnpm", "exec", "tsx", "src/seed.ts"]
    depends_on:
      api:
        condition: service_healthy
    restart: "no"

volumes:
  postgres-data:
